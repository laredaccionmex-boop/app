<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autor · La Redacción</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="site.css">
<style>
  .ap-cover { height: 170px; background: var(--ink-900); border-radius: var(--radius-lg); position: relative; overflow: hidden; background-size: cover; background-position: center; }
  .ap-cover__change { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; background: rgba(20,20,20,.62); color: var(--cream-50); border: 1px solid rgba(252,251,247,.25); border-radius: 999px; padding: 8px 14px; font-family: var(--font-body); font-size: 12.5px; font-weight: 600; cursor: pointer; backdrop-filter: blur(4px); }
  .ap-cover__change:hover { background: rgba(20,20,20,.8); }
  .ap-cover__change svg { width: 15px; height: 15px; }
  .ap-head { display: flex; align-items: flex-end; gap: 20px; margin: 16px 0 22px; padding: 0 8px; position: relative; }
  .ap-head .wd-av { width: 92px; height: 92px; font-size: 36px; border: 4px solid var(--cream-50); flex: none; margin-top: -64px; box-shadow: 0 6px 18px rgba(20,20,20,.18); }
  .ap-head .id { flex: 1; padding-bottom: 6px; }
  .ap-head h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: var(--text-strong); margin: 0; display: flex; align-items: center; gap: 10px; }
  .ap-head h1 .pro { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--ink-900); background: var(--yellow-400); border-radius: 999px; padding: 2px 8px; }
  .ap-head .meta { font-size: 13.5px; color: var(--text-muted); margin-top: 5px; }
  .ap-head .act { display: flex; gap: 10px; padding-bottom: 6px; }
  .ap-follow { height: 42px; padding: 0 22px; border-radius: var(--radius-md); border: 1.5px solid var(--ink-900); background: var(--ink-900); color: var(--cream-50); font-family: var(--font-body); font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .ap-follow.on { background: var(--surface-card); color: var(--text-strong); border-color: var(--border-default); }
  .ap-follow.on .l1 { display: none; } .ap-follow:not(.on) .l2 { display: none; }

  .ap-bio { font-family: var(--font-read); font-size: 17px; line-height: 1.6; color: var(--text-body); max-width: 70ch; margin: 0 8px 22px; }
  .ap-stats { display: flex; gap: 30px; margin: 0 8px 28px; padding: 18px 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
  .ap-stats div { font-size: 13px; color: var(--text-muted); }
  .ap-stats b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--text-strong); }

  .ap-sec { margin: 0 8px; }
  .ap-sec h2 { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--text-strong); margin: 0 0 16px; }
  .ap-posts { display: flex; flex-direction: column; gap: 2px; }
  .ap-post { padding: 18px 20px; display: block; border-radius: var(--radius-md); }
  .ap-post:hover { background: var(--cream-100); }
  .ap-post h3 { font-family: var(--font-read); font-weight: 600; font-size: 20px; letter-spacing: -.01em; color: var(--text-strong); margin: 0 0 6px; }
  .ap-post p { font-family: var(--font-read); font-size: 15px; line-height: 1.5; color: var(--text-muted); margin: 0 0 10px; }
  .ap-post .pm { display: flex; align-items: center; gap: 14px; font-family: var(--font-meta); font-size: 12px; color: var(--text-subtle); }
  .ap-post .pm .cat { color: var(--yellow-700); font-weight: 600; }

  .ap-books { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
  .ap-sec { margin-bottom: 38px; clear: both; overflow: visible; }
  .ap-sec h2 { margin-top: 0; }
  .ap-book .cv { position: relative; overflow: hidden; }
  .ap-book .cv img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ap-posts { display: flex; flex-direction: column; gap: 14px; }
  .ap-book { display: block; }
  .ap-book .cv { aspect-ratio: 2/3; border-radius: 10px; display: flex; align-items: flex-end; padding: 12px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--cream-50); line-height: 1.1; }
  .ap-book .bt { font-size: 14px; font-weight: 600; color: var(--text-strong); margin: 9px 0 2px; }
  .ap-book .bp { font-family: var(--font-meta); font-size: 12px; color: var(--text-muted); }
  @media (max-width: 900px){ .ap-books { grid-template-columns: repeat(2,1fr);} }
</style>
</head>
<body data-chrome="app" data-page="authors">
<div class="wd-shell" data-screen-label="Perfil de autor">
  <main class="wd-main">
    <div class="wd-top">
      <div class="wd-top__title"><a href="authors.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--text-muted);font-size:14px;font-weight:500"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Autores</a></div>
    </div>

    <div class="wd-body wd-body--wide">
      <div class="ap-cover" id="apCover"></div>
      <div class="ap-head">
        <span class="wd-av" id="apAv">RC</span>
        <div class="id">
          <h1 id="apName">Autor <span class="pro" id="apPro" hidden>Premium</span></h1>
          <div class="meta" id="apMeta">—</div>
        </div>
        <div class="act">
          <button class="ap-follow on" id="apFollow"><span class="l1">Seguir</span><span class="l2">✓ Siguiendo</span></button>
        </div>
      </div>

      <p class="ap-bio" id="apBio"></p>

      <div class="ap-stats">
        <div><b id="apBooks">0</b>Libros</div>
        <div><b id="apFollowers">0</b>Seguidores</div>
        <div><b id="apPosts">0</b>Entradas</div>
        <div><b id="apReads">0</b>Vistas únicas</div>
      </div>

      <div class="ap-sec" id="apBooksSec">
        <h2>Libros</h2>
        <div class="ap-books" id="apBookList"></div>
      </div>

      <div class="ap-sec">
        <h2>Entradas recientes</h2>
        <div class="ap-posts" id="apPostList"></div>
      </div>
    </div>
  </main>
</div>
<script src="shell.js"></script>
<script>
(function(){
  var AUTHORS = {
    'renata-cano': { n:'Renata Cano', i:'RC', pro:true, h:'Oficio · No ficción', av:'var(--ink-900)',
      bio:'Escribo sobre el arte de revisar y construir una carrera literaria por cuenta propia. Doce años editando a otros me enseñaron a editarme a mí.',
      books:14, followers:'3.1k', posts:62, reads:'48k',
      bookList:[['Cartas a quien empieza','$129','var(--ink-900)'],['El oficio de revisar','$99','var(--ink-800)']],
      postList:[['El oficio de revisar: editar es escribir dos veces','Oficio','Cuando termino un borrador, apenas empieza el trabajo de verdad.','3.1k'],['Diez años corrigiendo: lo que aprendí','No ficción','La página perfecta no existe; existe la página terminada.','1.8k']] },
    'julian-trejo': { n:'Julián Trejo', i:'JT', pro:false, h:'Ensayo · Crítica', av:'var(--amber-600)',
      bio:'Defiendo la escritura que no persigue tendencias. Lectores antes que algoritmos.',
      books:5, followers:'2.7k', posts:48, reads:'33k',
      bookList:[['Contra el algoritmo','$89','var(--amber-500)']],
      postList:[['Contra el algoritmo: escribir para personas','Ensayo','El SEO te encuentra lectores, pero la voz los conserva.','2.7k'],['Escribir antes de estar listo','Ensayo','Nadie está nunca listo. La página no lo exige.','890']] },
    'sofia-paredes': { n:'Sofía Paredes', i:'SP', pro:false, h:'Poesía', av:'var(--stone-500)',
      bio:'Poemas breves sobre la vida ordinaria, escritos para leerse en voz alta antes de salir de casa.',
      books:2, followers:'1.4k', posts:31, reads:'12k',
      bookList:[['Los lunes y la luz','Gratis','var(--stone-500)']],
      postList:[['Tres poemas sobre los lunes y la luz','Poesía','Pequeñas estampas de la vida ordinaria.','510']] },
    'miguel-godinez': { n:'Miguel Godínez', i:'MG', pro:true, h:'Crónica', av:'var(--ink-800)',
      bio:'Crónicas de talleres, ciudades y la comunidad que sostiene una voz. Sigo a la gente que escribe de noche.',
      books:8, followers:'1.9k', posts:40, reads:'27k',
      bookList:[['La ciudad que escribe de noche','Gratis','var(--yellow-500)']],
      postList:[['La ciudad que escribe de noche','Crónica','Durante tres meses seguí a doce autores a medianoche.','1.2k'],['Cómo fijé el precio de mi primer libro','Oficio','Ponerle número a tu trabajo sin miedo.','1.9k']] },
    'ana-lugo': { n:'Ana Lugo', i:'AL', pro:true, h:'Oficio · Video', av:'var(--ink-700)',
      bio:'Comparto mi proceso de edición en pantalla: del borrador desordenado a la entrada lista para vender.',
      books:3, followers:'2.4k', posts:27, reads:'21k',
      bookList:[['Editar en 30 días','$119','var(--ink-700)']],
      postList:[['Cómo edité mi primer libro en 30 días','Oficio','Un recorrido por el proceso completo, en pantalla.','2.4k']] },
    'rosa-vega': { n:'Rosa Vega', i:'RV', pro:false, h:'Ficción', av:'var(--clay-700)',
      bio:'Novelas sobre familias, cocinas y los años de comidas que las sostienen.',
      books:4, followers:'980', posts:19, reads:'8k',
      bookList:[['La mesa larga','$109','var(--clay-700)']],
      postList:[['La cocina como personaje','Ficción','Toda familia tiene una mesa donde se cuenta la verdad.','640']] }
  };

  function param(){ var m=location.search.match(/[?&]a=([^&]+)/); return m?decodeURIComponent(m[1]):'renata-cano'; }
  var key=param(), a=AUTHORS[key]||AUTHORS['renata-cano'];

  var COVERS={'renata-cano':'cover-oficio-revisar','julian-trejo':'cover-algoritmo','sofia-paredes':'cover-lunes-luz','miguel-godinez':'cover-ciudad-noche','ana-lugo':'cover-editar-30','rosa-vega':'cover-cocina'};
  var BOOKIMG={'Cartas a quien empieza':'book-cartas','Contra el algoritmo':'book-contra-algoritmo','La mesa larga':'book-la-mesa-larga','Editar en 30 días':'book-paginas-manana','Los lunes y la luz':'book-apuntes-lluvia'};
  document.title = a.n + ' · La Redacción';
  var cv=document.getElementById('apCover');
  cv.style.background='var(--ink-900) url(../assets/demo/'+(COVERS[key]||'cover-ciudad-noche')+'.png) center/cover no-repeat';
  var av=document.getElementById('apAv');
  av.innerHTML='<img src="../assets/demo/avatar-'+key+'.png" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  av.style.background=a.av; av.style.overflow='hidden'; av.style.padding='0';
  document.getElementById('apName').childNodes[0].nodeValue = a.n + ' ';
  var pro=document.getElementById('apPro'); if(a.pro) pro.hidden=false;
  document.getElementById('apMeta').textContent = a.h;
  document.getElementById('apBio').textContent = a.bio;
  document.getElementById('apBooks').textContent = a.books;
  document.getElementById('apFollowers').textContent = a.followers;
  document.getElementById('apPosts').textContent = a.posts;
  document.getElementById('apReads').textContent = a.reads;

  var bl=document.getElementById('apBookList');
  if(a.bookList && a.bookList.length){
    bl.innerHTML = a.bookList.map(function(b){
      return '<a class="ap-book" href="store.html">'+(BOOKIMG[b[0]]?'<div class="cv" style="padding:0;overflow:hidden"><img src="../assets/demo/'+BOOKIMG[b[0]]+'.png" alt="" style="width:100%;height:100%;object-fit:cover"></div>':'<div class="cv" style="background:'+b[2]+'">'+b[0]+'</div>')+'<div class="bt">'+b[0]+'</div><div class="bp">'+b[1]+(b[1]==='Gratis'?'':' MXN')+'</div></a>';
    }).join('');
  } else { document.getElementById('apBooksSec').style.display='none'; }

  document.getElementById('apPostList').innerHTML = a.postList.map(function(p){
    return '<a class="ap-post" href="post.html"><h3>'+p[0]+'</h3><p>'+p[2]+'</p><div class="pm"><span class="cat">'+p[1]+'</span><span>'+p[3]+' vistas únicas</span></div></a>';
  }).join('');

  document.getElementById('apFollow').addEventListener('click', function(){ this.classList.toggle('on'); });
})();
</script>
</body>
</html>
